<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10282c">
<title>下载潮痕 Windows 版</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10282c;color:#e8e4cf;font:16px/1.6 system-ui,sans-serif}
main{box-sizing:border-box;width:min(480px,calc(100% - 32px));padding:32px;border:1px solid #4b7d7a;background:#183337;border-radius:14px}
h1{margin:0 0 8px;font-size:28px}p{margin:8px 0 18px;color:#b7c9c5}button{padding:12px 20px;border:0;border-radius:8px;background:#72cbbc;color:#0b2428;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:default}progress{display:block;width:100%;margin:20px 0 8px;accent-color:#72cbbc}a{color:#9cddd3}
</style>
<main><h1>潮痕 · Windows 版</h1><p>v0.5.4 · 下载后解压，运行 TideScar-v0.5.4.exe。</p><button id="download">下载 ZIP（约 56 MB）</button><progress id="progress" max="3" value="0" hidden></progress><p id="status" role="status"></p><a href="./">返回在线游玩</a></main>
<script>
const button=document.querySelector('#download'),progress=document.querySelector('#progress'),status=document.querySelector('#status');
const sizes=[20971520,20971520,14004025],expected='e5f0516fe98fae0de88be20cfb181e0e317045281171a67b0a0e350a0c8c1498';
button.addEventListener('click',async()=>{button.disabled=true;progress.hidden=false;progress.value=0;const chunks=[];try{
for(let i=0;i<3;i++){status.textContent=`正在下载第 ${i+1}/3 段…`;const response=await fetch(`TideScar-v0.5.4-Windows.zip.part${i+1}`);if(!response.ok)throw new Error(`第 ${i+1} 段下载失败（${response.status}）`);const data=await response.arrayBuffer();if(data.byteLength!==sizes[i])throw new Error(`第 ${i+1} 段大小不符`);chunks.push(data);progress.value=i+1}
status.textContent='正在校验文件…';const blob=new Blob(chunks,{type:'application/zip'});const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer())),b=>b.toString(16).padStart(2,'0')).join('');if(hash!==expected)throw new Error('文件校验失败，请重新下载');
const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TideScar-v0.5.4-Windows.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='下载已开始。';
}catch(error){status.textContent=error.message;button.disabled=false}});
</script>
</html>
